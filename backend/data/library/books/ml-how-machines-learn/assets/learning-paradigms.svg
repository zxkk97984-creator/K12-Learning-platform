<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <title>机器学习三大流派对比图</title>
  <desc>横向排列三种学习方式：监督学习用带答案的习题册，无监督学习自动给数据分堆，强化学习靠奖励信号试错。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="520" rx="16" fill="#fbfcfe"/>

  <!-- 顶部标题 -->
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2a44">机器学习三大流派：看的信号不一样</text>

  <!-- ============ 监督学习 ============ -->
  <g>
    <rect x="30" y="70" width="260" height="420" rx="14" fill="#eaf3ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="30" y="70" width="260" height="52" rx="14" fill="#3b82f6"/>
    <rect x="30" y="108" width="260" height="14" fill="#3b82f6"/>
    <text x="160" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">有答案 · 监督学习</text>

    <!-- 数据卡片 -->
    <rect x="60" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="160" y="180" text-anchor="middle" font-size="19" fill="#1f2a44">题目（输入）</text>
    <text x="160" y="204" text-anchor="middle" font-size="17" fill="#64748b">一张猫的图片</text>

    <rect x="60" y="230" width="200" height="66" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="160" y="260" text-anchor="middle" font-size="19" fill="#1f2a44">答案（输出）</text>
    <text x="160" y="284" text-anchor="middle" font-size="17" fill="#64748b">标注：这是猫</text>

    <path d="M160,218 L160,226" stroke="#3b82f6" stroke-width="3"/>
    <polygon points="150,220 160,238 170,220" fill="#3b82f6"/>

    <!-- 模型 -->
    <rect x="90" y="318" width="140" height="54" rx="10" fill="#2563eb"/>
    <text x="160" y="351" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">学映射</text>

    <text x="160" y="412" text-anchor="middle" font-size="16" fill="#334155">对完答案才知道</text>
    <text x="160" y="438" text-anchor="middle" font-size="16" fill="#334155">学得怎么样</text>
    <text x="160" y="472" text-anchor="middle" font-size="15" fill="#64748b">习题册 + 红勾</text>
  </g>

  <!-- ============ 无监督学习 ============ -->
  <g>
    <rect x="320" y="70" width="260" height="420" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect x="320" y="70" width="260" height="52" rx="14" fill="#10b981"/>
    <rect x="320" y="108" width="260" height="14" fill="#10b981"/>
    <text x="450" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">只有数据 · 无监督学习</text>

    <!-- 散点 -->
    <circle cx="380" cy="178" r="13" fill="#34d399"/>
    <circle cx="418" cy="164" r="13" fill="#34d399"/>
    <circle cx="452" cy="186" r="13" fill="#34d399"/>
    <circle cx="500" cy="176" r="13" fill="#fbbf24"/>
    <circle cx="530" cy="196" r="13" fill="#fbbf24"/>
    <circle cx="508" cy="220" r="13" fill="#fbbf24"/>

    <path d="M400,196 Q430,210 465,196" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
    <path d="M495,214 Q515,226 532,210" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,4"/>

    <!-- 分堆箭头 -->
    <path d="M450,242 L450,262" stroke="#10b981" stroke-width="3"/>
    <polygon points="440,258 450,272 460,258" fill="#10b981"/>

    <!-- 自动分堆 -->
    <rect x="360" y="285" width="90" height="70" rx="10" fill="#d1fae5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="405" y="318" text-anchor="middle" font-size="17" fill="#065f46">A 堆</text>
    <text x="405" y="342" text-anchor="middle" font-size="15" fill="#64748b">相似放一起</text>

    <rect x="460" y="285" width="90" height="70" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="505" y="318" text-anchor="middle" font-size="17" fill="#92400e">B 堆</text>
    <text x="505" y="342" text-anchor="middle" font-size="15" fill="#64748b">相似放一起</text>

    <rect x="360" y="372" width="190" height="50" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="455" y="403" text-anchor="middle" font-size="17" fill="#334155">自动发现结构</text>

    <text x="450" y="472" text-anchor="middle" font-size="15" fill="#64748b">没人告诉你标准</text>
  </g>

  <!-- ============ 强化学习 ============ -->
  <g>
    <rect x="610" y="70" width="260" height="420" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="610" y="70" width="260" height="52" rx="14" fill="#ef4444"/>
    <rect x="610" y="108" width="260" height="14" fill="#ef4444"/>
    <text x="740" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">有奖励 · 强化学习</text>

    <!-- 智能体 -->
    <rect x="640" y="150" width="110" height="54" rx="10" fill="#f97316"/>
    <text x="695" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">智能体</text>

    <!-- 环境 -->
    <rect x="770" y="150" width="80" height="54" rx="10" fill="#fecaca" stroke="#fca5a5" stroke-width="2"/>
    <text x="810" y="182" text-anchor="middle" font-size="18" fill="#991b1b">环境</text>

    <!-- 动作 -->
    <path d="M755,170 L782,170" stroke="#f97316" stroke-width="3"/>
    <polygon points="780,165 792,170 780,175" fill="#f97316"/>
    <text x="768" y="150" text-anchor="middle" font-size="15" fill="#c2410c">动作</text>

    <!-- 奖励 -->
    <path d="M805,210 L780,210" stroke="#ef4444" stroke-width="3"/>
    <polygon points="782,205 770,210 782,215" fill="#ef4444"/>
    <text x="798" y="240" text-anchor="middle" font-size="15" fill="#dc2626">奖励/惩罚</text>

    <!-- 金币 -->
    <circle cx="660" cy="330" r="22" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <text x="660" y="337" text-anchor="middle" font-size="20" fill="#b45309">$</text>
    <circle cx="720" cy="330" r="22" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <text x="720" y="337" text-anchor="middle" font-size="20" fill="#b45309">$</text>

    <!-- 右上惩罚 -->
    <polygon points="742,306 750,322 738,322" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <text x="688" y="388" text-anchor="middle" font-size="17" fill="#334155">追长期高回报</text>

    <text x="740" y="412" text-anchor="middle" font-size="16" fill="#334155">眼前吃亏也值得</text>
    <text x="740" y="438" text-anchor="middle" font-size="15" fill="#64748b">下棋、机器人</text>
    <text x="740" y="472" text-anchor="middle" font-size="15" fill="#64748b">靠试错练策略</text>
  </g>
</svg>
