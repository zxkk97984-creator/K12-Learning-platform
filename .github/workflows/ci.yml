name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (migration + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: shuangling
          POSTGRES_PASSWORD: shuangling
          POSTGRES_DB: shuangling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuangling -d shuangling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://shuangling:shuangling@localhost:5432/shuangling
      JWT_SECRET: ci-only-32bytes-jwt-secret-0123456789
      AI_PROVIDER: mock
      AI_MODEL: mock-model
      EMBEDDING_PROVIDER: mock
      VOICE_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Content init (validate_library --all → import_library --all)
        run: |
          uv run python -m app.scripts.validate_library --all
          uv run python -m app.scripts.import_library --all
      - name: Pytest
        run: uv run pytest -q
      - name: "Start background worker (smoke: boot + poll against Postgres)"
        run: |
          uv run python -m app.jobs.worker > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          sleep 5
          kill -0 "$(cat /tmp/worker.pid)" || { cat /tmp/worker.log; exit 1; }
          echo "Worker is alive and polling the queue"
      # T25a：Worker 验证"至少一个任务到终态"，而不只是进程存活。
      # 入队一个 memory_consolidation 任务，轮询 background_jobs 直至 success/failed。
      - name: "Worker smoke: enqueue a job and assert it reaches a terminal status"
        run: |
          uv run python - <<'PY'
          import asyncio, sys, uuid
          from sqlalchemy import select
          from app.infrastructure.database.models import (
              BackgroundJob, StudentProfile, User,
          )
          from app.infrastructure.database.session import async_session
          from app.jobs import queue
          from app.modules.identity.security import hash_password

          # CI 专用隔离账号（服务容器 DB 每次全新，无真实学生数据）。
          STUDENT_USERNAME = "ci-worker-smoke"

          async def ensure_student(session) -> "StudentProfile":
              user = (await session.execute(
                  select(User).where(User.username == STUDENT_USERNAME)
              )).scalar_one_or_none()
              if user is None:
                  user = User(
                      username=STUDENT_USERNAME,
                      password_hash=hash_password("ci-only-smoke-password"),
                      user_type="STUDENT",
                  )
                  session.add(user)
                  await session.flush()
              profile = (await session.execute(
                  select(StudentProfile).where(StudentProfile.user_id == user.user_id)
              )).scalar_one_or_none()
              if profile is None:
                  profile = StudentProfile(user_id=user.user_id, nickname="CI Smoke", grade=8, language="zh-CN")
                  session.add(profile)
                  await session.flush()
              return profile

          async def main():
              async with async_session() as session:
                  profile = await ensure_student(session)
                  job = await queue.enqueue(
                      session, "memory_consolidation", {"student_id": str(profile.student_id)}
                  )
                  await session.commit()
                  for _ in range(30):
                      row = (await session.execute(
                          select(BackgroundJob).where(BackgroundJob.job_id == job.job_id)
                      )).scalar_one_or_none()
                      if row and row.status in ("success", "failed"):
                          print(f"JOB TERMINAL: {row.job_type} -> {row.status}")
                          return
                      await asyncio.sleep(1)
                  print("FAIL: job did not reach a terminal status within 30s")
                  sys.exit(1)
          asyncio.run(main())
          PY
      - name: Stop background worker
        if: always()
        run: |
          if [ -f /tmp/worker.pid ]; then kill "$(cat /tmp/worker.pid)" || true; fi

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (backend + Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: shuangling
          POSTGRES_PASSWORD: shuangling
          POSTGRES_DB: shuangling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuangling -d shuangling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://shuangling:shuangling@localhost:5432/shuangling
      JWT_SECRET: ci-only-32bytes-jwt-secret-0123456789
      AI_PROVIDER: mock
      AI_MODEL: mock-model
      EMBEDDING_PROVIDER: mock
      VOICE_PROVIDER: mock
      VITE_API_PROXY_TARGET: http://127.0.0.1:8002
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (script starts backend + worker + seed + content init + cleans up)
        run: bash scripts/ci-e2e.sh
      # T25a：E2E 失败时保留 trace/screenshot 及后端/worker 日志，便于定位。
      - name: Upload Playwright trace/screenshot + backend/worker logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            frontend/test-results/**/*.zip
            frontend/test-results/**/*.png
            frontend/playwright-report/**/*.html
          if-no-files-found: ignore
      - name: Upload backend/worker logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            /tmp/shuangling-backend.*.log
            /tmp/shuangling-worker.*.log
          if-no-files-found: ignore
