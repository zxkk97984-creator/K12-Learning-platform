name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (migration + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: shuangling
          POSTGRES_PASSWORD: shuangling
          POSTGRES_DB: shuangling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuangling -d shuangling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://shuangling:shuangling@localhost:5432/shuangling
      JWT_SECRET: ci-only-32bytes-jwt-secret-0123456789
      AI_PROVIDER: mock
      AI_MODEL: mock-model
      EMBEDDING_PROVIDER: mock
      VOICE_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Content init (validate_library --all → import_library --all)
        run: |
          uv run python -m app.scripts.validate_library --all
          uv run python -m app.scripts.import_library --all
      - name: Pytest
        run: pytest -q
      - name: Start background worker (smoke: boot + poll against Postgres)
        run: |
          uv run python -m app.jobs.worker > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          sleep 5
          kill -0 "$(cat /tmp/worker.pid)" || { cat /tmp/worker.log; exit 1; }
          echo "Worker is alive and polling the queue"
      - name: Stop background worker
        if: always()
        run: |
          if [ -f /tmp/worker.pid ]; then kill "$(cat /tmp/worker.pid)" || true; fi

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (backend + Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: shuangling
          POSTGRES_PASSWORD: shuangling
          POSTGRES_DB: shuangling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuangling -d shuangling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://shuangling:shuangling@localhost:5432/shuangling
      JWT_SECRET: ci-only-32bytes-jwt-secret-0123456789
      AI_PROVIDER: mock
      AI_MODEL: mock-model
      EMBEDDING_PROVIDER: mock
      VOICE_PROVIDER: mock
      VITE_API_PROXY_TARGET: http://127.0.0.1:8002
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (script starts backend + worker + seed + content init + cleans up)
        run: bash scripts/ci-e2e.sh
