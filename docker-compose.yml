services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: shuangling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shuangling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shuangling}
      POSTGRES_DB: ${POSTGRES_DB:-shuangling}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后台 Worker：消费 PostgreSQL 表驱动队列（knowledge_ingest /
  # conversation_summary / memory_consolidation），与 API 共用 backend 代码镜像。
  # 仅在显式 `docker compose up worker`（或 --profile worker）时启动，
  # 本地一键启动脚本默认以宿主机进程运行 Worker，避免双实例混淆。
  worker:
    build:
      context: ./backend
    image: shuangling-backend:latest
    container_name: shuangling-worker
    restart: unless-stopped
    profiles: ["worker"]
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shuangling}:${POSTGRES_PASSWORD:-shuangling}@postgres:5432/${POSTGRES_DB:-shuangling}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32bytes-secret}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-mock-model}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 与宿主机 API 共享知识库源文件，保证 Worker 能解析同一批上传资源。
      - ./backend/storage:/app/storage


  redis:
    image: redis:7-alpine
    container_name: shuangling-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: shuangling-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shuangling}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shuangling123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
